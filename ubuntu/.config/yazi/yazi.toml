# Yazi Configuration (Behavior)
# Reference: https://yazi-rs.github.io/docs/configuration/yazi

[manager]
ratio = [ 1, 4, 3 ]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = true
show_symlink = true

[preview]
tab_size = 4
max_width = 1000
max_height = 1000
cache_dir = ""
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15

[opener]
edit = [
	{ run = 'micro %s', block = true, desc = "Edit with Micro" },
	{ run = 'code %s', desc = "Edit with VS Code" },
]
open = [
	{ run = 'xdg-open %s', desc = "Open with system default" },
]
reveal = [
	{ run = 'xdg-open %d1', desc = "Reveal in file manager" },
]

[open]
rules = [
	{ mime = "text/*", use = [ "edit", "reveal" ] },
	{ mime = "application/json", use = [ "edit", "reveal" ] },
	{ mime = "application/x-sh", use = [ "edit", "reveal" ] },
	{ mime = "application/javascript", use = [ "edit", "reveal" ] },
	{ mime = "application/xml", use = [ "edit", "reveal" ] },
	{ mime = "inode/x-empty", use = [ "edit", "reveal" ] },
	{ mime = "image/*", use = [ "open", "reveal" ] },
	{ mime = "video/*", use = [ "open", "reveal" ] },
	{ mime = "audio/*", use = [ "open", "reveal" ] },
	{ mime = "application/pdf", use = [ "open", "reveal" ] },
	{ url = "*", use = [ "open", "reveal" ] },
]

[input]
cd_title  = "Jump to:"
cd_origin = "top-center"
cd_offset = [ 0, 2, 50, 3 ]
